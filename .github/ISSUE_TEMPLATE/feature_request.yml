name: Feature request
description: Suggest a focused, safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: This does not request raw EC writes, firmware-check bypasses, overclocking or disabled thermal protection.
          required: true
