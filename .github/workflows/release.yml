name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Build source archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="fan-driver-${VERSION#v}"
          git archive --format=tar --prefix="${archive}/" HEAD | gzip -9 > "${archive}.tar.gz"
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --generate-notes
          fan-driver-*.tar.gz
          fan-driver-*.tar.gz.sha256
